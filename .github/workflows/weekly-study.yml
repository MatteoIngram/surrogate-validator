name: Weekly market-data study

on:
  schedule:
    - cron: "0 7 * * 6"   # Saturdays 07:00 UTC, after Friday's closes
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write   # commit study/results.json
  pages: write      # request a GitHub Pages rebuild

concurrency:
  group: weekly-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: study/requirements.txt

      - name: Install dependencies
        run: pip install -r study/requirements.txt

      - name: Unit tests (fast subset)
        run: python -m pytest tests -q -k "not white_noise and not garch_rejects and not lorenz and not strategy_detects"

      - name: Run the study
        run: python study/run_study.py

      - name: Commit results if they changed
        id: commit
        run: |
          if git diff --quiet -- study/results.json; then
            echo "No change in results."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study/results.json
          git commit -m "Weekly study: data to $(python -c 'import json;print(json.load(open("study/results.json"))["end"])')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
